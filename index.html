<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AC1DST4R • GitHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="logo">GitHub</span>
</header>

<main class="container">

  <!-- PROFILE -->
  <section class="profile">
    <img id="avatar">
    <h1 id="name"></h1>
    <h2 id="username"></h2>
    <p id="bio"></p>

    <div class="stats">
      <span id="followers"></span>
      <span id="following"></span>
      <span id="repos"></span>
    </div>

    <a id="githubLink" class="btn" target="_blank">View on GitHub</a>
  </section>

  <!-- TABS -->
  <nav class="tabs">
    <button class="tab active" data-tab="repos">Repositories</button>
    <button class="tab" data-tab="pages">Pages</button>
    <button class="tab" data-tab="activity">Activity</button>
  </nav>

  <!-- TAB CONTENT -->
  <section class="tab-content">

    <!-- REPOS -->
    <div id="repos" class="panel active">
      <input id="search" placeholder="Find a repository…">
      <div id="repoList"></div>
    </div>

    <!-- PAGES -->
    <div id="pages" class="panel">
      <div id="pagesList"></div>
    </div>

    <!-- ACTIVITY -->
    <div id="activity" class="panel">
      <h3>Recent Activity</h3>
      <div id="activityList"></div>

      <h3>Contribution Graph</h3>
      <img id="contribGraph">
    </div>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
