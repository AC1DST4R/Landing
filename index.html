<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AC1DST4R • GitHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <span class="logo">GitHub</span>
  </header>

  <main class="container">

    <section class="profile">
      <img id="avatar" alt="Profile picture">
      <h1 id="name"></h1>
      <h2 id="username"></h2>
      <p id="bio"></p>

      <div class="stats">
        <span id="followers"></span>
        <span id="following"></span>
        <span id="repos"></span>
      </div>

      <a id="githubLink" class="btn" target="_blank">View on GitHub</a>
    </section>

    <section class="repo-section">
      <div class="repo-header">
        <h3>Repositories</h3>
        <input type="text" id="search" placeholder="Find a repository…">
      </div>

      <div id="repoList">Loading repositories…</div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
