<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AC1DST4R • GitHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <span class="logo">GitHub</span>
</header>

<main class="container">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <img id="avatar" class="avatar">
    <h2 id="name"></h2>
    <p id="username"></p>
    <p id="bio"></p>

    <div class="stats">
      <span id="followers"></span>
      <span id="following"></span>
    </div>

    <a id="githubLink" class="btn" target="_blank">View on GitHub</a>
  </aside>

  <!-- MAIN CONTENT -->
  <section class="main">

    <!-- TABS -->
    <nav class="tabs">
      <button class="tab active" data-tab="popular">Popular</button>
      <button class="tab" data-tab="all">All Repositories</button>
    </nav>

    <!-- PANELS -->
    <div id="popular" class="panel active">
      <div id="pinnedList"></div>
    </div>

    <div id="all" class="panel">
      <input id="search" placeholder="Find a repository…" />
      <div id="repoList"></div>
    </div>

  </section>

  <!-- RIGHT ACTIVITY -->
  <aside class="activity">
    <h3>Recent Activity</h3>
    <div id="activityList"></div>

    <h3>Contributions</h3>
    <img id="contribGraph">
  </aside>

</main>

<script src="script.js"></script>
</body>
</html>
